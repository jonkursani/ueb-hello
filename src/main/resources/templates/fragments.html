<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
    <header th:fragment="header(active)">
        <nav>
            <a th:href="@{/pages/quotes}"
               th:classappend="${active == 'quotes'} ? 'active' : ''">
                Quotes
            </a>
            <a th:href="@{/pages/about}"
               th:classappend="${active == 'about'} ? 'active' : ''">
                About us
            </a>
            <a th:href="@{/pages/quotes/new}"
               th:classappend="${active == 'quote-form'} ? 'active' : ''">
                Add Quote
            </a>
        </nav>
    </header>

    <footer th:fragment="footer">
        <p>&copy; Quotes - Cacttus Education - All rights reserved.</p>
    </footer>
</body>
</html>
