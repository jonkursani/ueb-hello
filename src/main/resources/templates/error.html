<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::title}, ~{::main}, '')}">
<head>
    <title>General Error</title>
</head>
<body>
<main class="site-main">
    <div class="error-page">
        <div class="error-page__code" th:text="${status} ?: 'Error'">500</div>
        <h1>General Error</h1>
        <p>An error occurred while processing your request.</p>
        <a class="btn btn--primary" th:href="@{/pages/quotes}">
            <svg th:replace="~{fragments :: icon('back')}"></svg>Go back to the quotes page
        </a>
    </div>
</main>
</body>
</html>
