<!doctype html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::title}, ~{::main}, 'authors')}">
<head>
    <title>Authors</title>
</head>
<body>
<main class="site-main">
    <div class="page-head">
        <h1 class="page-title">Authors</h1>
    </div>

    <div class="table-wrap">
        <table class="table">
            <thead>
            <tr><th>Author</th><th class="num">Quotes</th></tr>
            </thead>
            <tbody>
            <!-- nje rresht per autor; quotes vjen me left join fetch, pa select te dyte -->
            <tr th:each="a : ${authors}">
                <td><a th:href="@{/pages/authors/{id}(id=${a.id})}" th:text="${a.name}">Author</a></td>
                <td class="num" data-label="Quotes" th:text="${a.quotes.size()}">0</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
