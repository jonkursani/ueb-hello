<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::title}, ~{::main}, '')}">
<head>
    <title>Not found</title>
</head>
<body>
<main class="site-main">
    <div class="error-page">
        <div class="error-page__code">404</div>
        <h1>Not found</h1>
        <p>
            The page you are looking for does not exist.
            <span th:if="${path}"><br>Path: <code th:text="${path}">/x</code></span>
        </p>
        <a class="btn btn--primary" th:href="@{/pages/quotes}">
            <svg th:replace="~{fragments :: icon('back')}"></svg>Go back to the quotes page
        </a>
        <p class="error-page__quote">“Seek and you shall find.”</p>
    </div>
</main>
</body>
</html>
