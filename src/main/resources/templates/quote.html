<!doctype html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::title}, ~{::main}, '')}">
<head>
    <title>Quote</title>
</head>
<body>
<main>
    <h1 th:text="${quote.text}"></h1>
    <p>
        Filtro autorin:
        <a th:href="@{/pages/quotes(author=${quote.author})}"
           th:text="${quote.author}"></a>
    </p>
    <p>
        <a th:href="@{/pages/quotes}">Back to Quotes</a>
    </p>
</main>
</body>
</html>
