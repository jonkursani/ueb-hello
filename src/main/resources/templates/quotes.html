<!doctype html>
<html lang="en"
      th:replace="~{layout :: layout(~{::title}, ~{::main}, 'quotes')}"
      xmlns:th="http://www.thymeleaf.org">
<head>
<!--    <meta charset="UTF-8">-->
<!--    <meta name="viewport" content="width=device-width, initial-scale=1">-->
<!--    <link rel="stylesheet" th:href="@{/css/app.css}">-->
    <title>Quotes</title>
</head>
<body>
<!--    <div th:replace="~{fragments :: header('quotes')}"></div>-->
<!--    <div th:insert="~{fragments :: footer}"></div>-->

<main>
    <h1>Quotes List</h1>

    <p th:text="${quotes.size()} + ' quotes'"></p>
    <p th:if="${quotes.isEmpty()}">No quotes found.</p>
    <table border="1">
        <tr>
            <th>#</th>
            <th>Quote</th>
            <th>Author</th>
        </tr>
        <tr th:each="q : ${quotes}">
            <td th:text="${q.id}">1</td>
            <td>
                <a th:href="@{/pages/quotes/{id}(id=${q.id})}"
                   th:text="${q.text}"></a>
            </td>
            <td th:text="${q.author}">Uvejs</td>
        </tr>
    </table>
</main>

<!--    <div th:replace="~{fragments :: footer}"></div>-->
</body>
</html>
